services:

  netwatch:
    build: .
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: netwatchdb
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_DATABASE: netwatchdb
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - DatabaseVolume:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 6767:80
    environment:
      - PMA_ARBITRARY=1
    depends_on:
      - db

    web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    volumes:
      - WebserverVolume:/var/www/html
    depends_on:
      - db

volumes:
  DatabaseVolume:
